name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spm:
    name: SwiftPM build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Resolve SwiftPM dependencies
        run: xcodebuild -resolvePackageDependencies -scheme glomo-ios-sdk
      - name: Build and test SwiftPM package on iOS simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme glomo-ios-sdk \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipMacroValidation \
            | xcpretty || xcodebuild test \
            -scheme glomo-ios-sdk \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipMacroValidation

  # This job intentionally exercises the UIKit/WebKit checkout controller. Plain `swift test`
  # builds for macOS, where `canImport(UIKit)` is false and the checkout controller is compiled
  # out of the test binary.
  ios-simulator:
    name: iOS simulator tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: List simulators
        run: xcrun simctl list devices available
      - name: Test on iOS destination
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme glomo-ios-sdk \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipMacroValidation \
            | xcpretty || xcodebuild test \
            -scheme glomo-ios-sdk \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipMacroValidation

  podspec:
    name: Podspec lint
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Lint podspec
        run: pod lib lint glomo-ios-sdk.podspec --allow-warnings --verbose
