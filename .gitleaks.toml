# gitleaks configuration for the GlomoPay iOS SDK.
#
# Inherits all default gitleaks rules. The scoped allowlists below exist because
# this SDK has intentionally shipped publishable client-side identifiers, and a
# scanner cannot tell those apart from leaked credentials.
#
# Do not broaden this file to silence a new finding. If a scan fails, the default
# assumption is that something genuinely leaked.

title = "GlomoPay iOS SDK"

[extend]
useDefault = true

[[allowlists]]
description = """
Historical Segment analytics write key. This publishable client-side key was
removed from the current SDK, but gitleaks scans the full Git history. Keep this
exception scoped to its original declaration so historical commits continue to
pass without allowing unrelated credentials.
"""
condition = "AND"
paths = ['''^Sources/GlomoPaySDK/Analytics/GlomoPayAnalytics\.swift$''']
regexTarget = "line"
regexes = ['''defaultWriteKey\s*=\s*"[A-Za-z0-9]{32}"''']

[[allowlists]]
description = """
Release-approved Mixpanel project token and Sentry DSN. Both are publishable
client-side identifiers bundled in merchant applications and grant no read or
administrative access. This exception is restricted to the generated SDK-owned
telemetry resource; Sentry auth tokens and upload credentials remain forbidden.
"""
condition = "AND"
paths = ['''^Sources/GlomoPaySDK/Resources/GlomoPayTelemetryConfiguration\.plist$''']
regexTarget = "line"
regexes = [
  '''<string>[A-Fa-f0-9]{32}</string>''',
  '''<string>https://[A-Fa-f0-9]+@[^<]+\.sentry\.io/[0-9]+</string>'''
]
