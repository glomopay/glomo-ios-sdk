# gitleaks configuration for the GlomoPay iOS SDK.
#
# Inherits all default gitleaks rules. The single allowlist below exists because
# this SDK intentionally ships a publishable client-side key, and a scanner
# cannot tell that apart from a leaked credential.
#
# Do not broaden this file to silence a new finding. If a scan fails, the default
# assumption is that something genuinely leaked.

title = "GlomoPay iOS SDK"

[extend]
useDefault = true

[[allowlists]]
description = """
Release-approved Mixpanel project token and Sentry DSN. Both are publishable
client-side identifiers bundled in merchant applications and grant no read or
administrative access. This exception is restricted to the generated SDK-owned
telemetry resource; Sentry auth tokens and upload credentials remain forbidden.
"""
condition = "AND"
paths = ['''^Sources/GlomoPaySDK/Resources/GlomoPayTelemetryConfiguration\.plist$''']
regexTarget = "line"
regexes = [
  '''<string>[A-Fa-f0-9]{32}</string>''',
  '''<string>https://[A-Fa-f0-9]+@[^<]+\.sentry\.io/[0-9]+</string>'''
]
