# gitleaks configuration for the GlomoPay iOS SDK.
#
# Inherits all default gitleaks rules. The single allowlist below exists because
# this SDK intentionally ships a publishable client-side key, and a scanner
# cannot tell that apart from a leaked credential.
#
# Do not broaden this file to silence a new finding. If a scan fails, the default
# assumption is that something genuinely leaked.

title = "GlomoPay iOS SDK"

[extend]
useDefault = true

[[allowlists]]
description = """
Segment analytics write key. Publishable by design: it ships in every distributed
build of every GlomoPay SDK (Flutter, React Native, iOS, Android), is present in
the binary of every merchant app, and grants no read access to any data. It is the
same class of key as the merchant's own publishable key. Rotating it would require
a coordinated multi-SDK release and a merchant upgrade cycle for no security gain.

Scoped to this one declaration in this one file, and requires BOTH the path and the
line to match. See SECURITY.md, 'What is not a vulnerability'.
"""
condition = "AND"
paths = ['''^Sources/GlomoPaySDK/Analytics/GlomoPayAnalytics\.swift$''']
regexTarget = "line"
regexes = ['''defaultWriteKey\s*=\s*"[A-Za-z0-9]{32}"''']
